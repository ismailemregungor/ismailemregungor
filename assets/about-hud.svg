<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070812" />
      <stop offset="50%" stop-color="#0d1021" />
      <stop offset="100%" stop-color="#130b24" />
    </linearGradient>
    <linearGradient id="neonBorder" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="2" y="2" width="796" height="236" rx="12" />
    </clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; }
      .key { fill: #00f0ff; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .val { fill: #e2e8f0; font-size: 14px; font-weight: 500; }
      .dim { fill: #64748b; font-size: 12px; }
      .accent { fill: #ff2a85; font-size: 14px; font-weight: 600; }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; r: 4; }
        50% { opacity: 0.4; r: 3; }
      }
      @keyframes scan {
        0% { transform: translateY(-40px); }
        100% { transform: translateY(250px); }
      }
      @keyframes float1 {
        0%, 100% { transform: translate(0px, 0px); opacity: 0.35; }
        50% { transform: translate(12px, -18px); opacity: 0.85; }
      }
      @keyframes float2 {
        0%, 100% { transform: translate(0px, 0px); opacity: 0.25; }
        50% { transform: translate(-15px, 14px); opacity: 0.75; }
      }
      .cursor { animation: blink 1s infinite; }
      .status-dot { animation: pulse 2s ease-in-out infinite; }
      .scanline { animation: scan 5s linear infinite; }
      .p1 { animation: float1 6s ease-in-out infinite; }
      .p2 { animation: float2 7.5s ease-in-out infinite; }
      .p3 { animation: float1 8.5s ease-in-out infinite reverse; }
    </style>
  </defs>

  <!-- Main Card -->
  <rect x="2" y="2" width="796" height="236" rx="12" fill="url(#bgGrad)" stroke="url(#neonBorder)" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Subtle Grid & Scanline & Floating Particles -->
  <g clip-path="url(#cardClip)">
    <g opacity="0.06" stroke="#00f0ff" stroke-width="0.6">
      <line x1="0" y1="60" x2="800" y2="60" />
      <line x1="0" y1="120" x2="800" y2="120" />
      <line x1="0" y1="180" x2="800" y2="180" />
      <line x1="200" y1="0" x2="200" y2="240" />
      <line x1="400" y1="0" x2="400" y2="240" />
      <line x1="600" y1="0" x2="600" y2="240" />
    </g>
    <rect class="scanline" x="0" y="0" width="800" height="36" fill="url(#scanGrad)" />
    <circle class="p1" cx="690" cy="85" r="2" fill="#00f0ff" filter="url(#glowCyan)" />
    <circle class="p2" cx="740" cy="145" r="2.2" fill="#ff007f" />
    <circle class="p3" cx="645" cy="185" r="1.8" fill="#9d4edd" />
    <circle class="p2" cx="760" cy="70" r="1.5" fill="#00f0ff" />
  </g>

  <!-- Neon Corner Brackets -->
  <path d="M 2 22 L 2 10 Q 2 2 10 2 L 26 2" stroke="#00f0ff" stroke-width="2.5" filter="url(#glowCyan)" />
  <path d="M 774 2 L 790 2 Q 798 2 798 10 L 798 22" stroke="#ff007f" stroke-width="2.5" />
  <path d="M 2 218 L 2 230 Q 2 238 10 238 L 26 238" stroke="#ff007f" stroke-width="2.5" />
  <path d="M 774 238 L 790 238 Q 798 238 798 230 L 798 218" stroke="#00f0ff" stroke-width="2.5" filter="url(#glowCyan)" />

  <!-- Top HUD Bar -->
  <rect x="2" y="2" width="796" height="36" rx="12" fill="#ffffff" fill-opacity="0.03" />
  <line x1="2" y1="38" x2="798" y2="38" stroke="#00f0ff" stroke-opacity="0.2" stroke-width="1" />
  <circle cx="24" cy="20" r="4.5" fill="#ff007f" />
  <circle cx="40" cy="20" r="4.5" fill="#facc15" />
  <circle cx="56" cy="20" r="4.5" fill="#00f0ff" />
  <text x="76" y="24" class="mono dim">SYS://ISMAILEMREGUNGOR.HUD</text>

  <!-- Online Status -->
  <circle class="status-dot" cx="688" cy="20" r="4" fill="#00f0ff" filter="url(#glowCyan)" />
  <text x="700" y="24" class="mono" fill="#00f0ff" font-size="11" font-weight="700" letter-spacing="1">ONLINE</text>

  <!-- Terminal Rows -->
  <text x="32" y="76" class="mono key">&gt; ROLE</text>
  <text x="150" y="76" class="mono val">Software Developer @ <tspan fill="#00f0ff" font-weight="700">Ziraat Teknoloji</tspan></text>

  <text x="32" y="112" class="mono key">&gt; STACK</text>
  <text x="150" y="112" class="mono val">C#  <tspan fill="#ff007f">·</tspan>  .NET  <tspan fill="#ff007f">·</tspan>  TypeScript  <tspan fill="#ff007f">·</tspan>  React</text>

  <text x="32" y="148" class="mono key">&gt; AI_RIG</text>
  <text x="150" y="148" class="mono val">Claude  <tspan fill="#00f0ff">·</tspan>  Codex  <tspan fill="#00f0ff">·</tspan>  Antigravity</text>

  <text x="32" y="184" class="mono key">&gt; SIGNAL</text>
  <text x="150" y="184" class="mono val">ismailemre.gungor@gmail.com</text>

  <text x="32" y="216" class="mono dim">~/workspace $</text>
  <text x="150" y="216" class="mono accent">building clean, high-impact software</text>
  <rect class="cursor" x="458" y="204" width="8" height="15" fill="#00f0ff" filter="url(#glowCyan)" />
</svg>
